# Configuração do projeto Supabase local (Conecta Dons)
# Gerado/mantido manualmente. Se `supabase start` reclamar de algum campo,
# rode `npx supabase init --force` para regenerar e reaplique as migrations.
project_id = "conecta-dons"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Signup público desabilitado: só o master inicial (criado no painel) e pastores criados
# pela Edge Function create-pastor (admin API). Membros não têm login.
enable_signup = false

[auth.email]
enable_confirmations = false

# Edge Function: o master cadastra pastores pela plataforma (ver functions/create-pastor).
[functions.create-pastor]
verify_jwt = true

[analytics]
enabled = false
