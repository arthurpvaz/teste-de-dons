<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastores Cadastrados</title><link rel="stylesheet" href="css/main.css"><style>body{font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#d8f0e8,#174b58);min-height:100vh;margin:0;color:#173b32}.navbar{background:#174b58;color:#fff;padding:15px 30px;display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:10px}.btn{border:0;border-radius:8px;padding:10px 15px;cursor:pointer}.primary{background:#07543e;color:#fff}.danger{background:#b91c1c;color:#fff}.wrap{width:90%;max-width:1100px;margin:35px auto}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 30px #0002}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid #e5e7eb;text-align:left}.muted{color:#64748b}.edit{padding:7px;border:1px solid #cbd5e1;border-radius:6px}.search{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;margin:15px 0}@media(max-width:700px){.table{font-size:.8rem}.table th:nth-child(4),.table td:nth-child(4){display:none}}</style></head><body><nav class="navbar"><strong>IGREJA PRESBITERIANA — CONECTA DONS</strong><div class="actions"><button class="btn primary" onclick="cadastro()">Novo Pastor</button><button class="btn danger" id="sair">Sair</button></div></nav><main class="wrap"><section class="card"><h1>Pastores Cadastrados</h1><p class="muted">Dados de identidade vêm do Supabase Auth. Senhas não são armazenadas/exibidas pelo painel.</p><input id="pesquisar" class="search" type="search" placeholder="Pesquisar por nome ou e-mail..."><table class="table"><thead><tr><th>Nome</th><th>E-mail</th><th>Igreja-sede</th><th>Master</th></tr></thead><tbody id="corpo-tabela"></tbody></table></section></main><script src="../supabase-config.js"></script><script type="module" src="manutencao_Fiel.js"></script></body></html>
