<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastores - Conecta Dons</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/records.css"><style>body{font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#d8f0e8,#174b58);min-height:100vh;margin:0;padding-bottom:60px;color:#173b32}.navbar{background:#174b58;color:#fff;padding:15px 30px;display:flex;justify-content:space-between;align-items:center}.navbar a{color:#fff}.wrap{width:90%;max-width:1100px;margin:35px auto}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 30px #0002;margin-bottom:20px}.header{display:flex;justify-content:space-between;align-items:center;gap:15px}.btn{border:0;border-radius:8px;padding:10px 15px;cursor:pointer}.primary{background:#07543e;color:#fff}.danger{background:#b91c1c;color:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form input{padding:11px;border:1px solid #cbd5e1;border-radius:7px}.form button{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}.muted{color:#64748b;font-size:.9rem}@media(max-width:700px){.form{grid-template-columns:1fr}}</style></head><body><nav class="navbar"><strong>IGREJA PRESBITERIANA — CONECTA DONS</strong><button class="btn danger" id="sair">Sair</button></nav><main class="wrap"><section class="card"><div class="header"><div><h1>Pastores cadastrados</h1><p class="muted">Usuários são gerenciados pelo Supabase Auth. Senhas nunca são exibidas.</p></div><button class="btn primary" id="novo">+ Novo pastor</button></div></section><section class="card" id="form-card" hidden><h2>Novo pastor</h2><form class="form" id="pastor-form"><input id="email" type="email" placeholder="E-mail" required><input id="full_name" type="text" placeholder="Nome completo" required><input id="password" type="password" placeholder="Senha inicial (mín. 6)" minlength="6" required><select id="church" required style="padding:11px;border:1px solid #cbd5e1;border-radius:7px"><option value="">Igreja-sede</option></select><button class="btn primary" type="submit">Cadastrar pastor</button></form></section><section class="card"><table class="table"><thead><tr><th>Nome</th><th>E-mail</th><th>Igreja-sede</th><th>Master</th></tr></thead><tbody id="corpo-tabela"></tbody></table></section></main><script src="../supabase-config.js"></script><script type="module" src="cadastro_Administrador.js"></script></body></html>
